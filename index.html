<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maliyet Hesabı</title>
<style>
:root{--bg:#f3f5fa;--card:#fff;--tx:#14181f;--mu:#6a7483;--bd:#e3e7ef;--ac:#2563eb;--ok:#0f9d58;--dg:#d93025;--h1:#1e3a8a;--h2:#2563eb;--sh:0 2px 10px rgba(20,30,60,.07);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1218;--card:#181c24;--tx:#eaedf3;--mu:#98a2b3;--bd:#2a303b;--ac:#6ea0ff;--ok:#41c57d;--dg:#f2766b;--h1:#172554;--h2:#1d4ed8;--sh:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1218;--card:#181c24;--tx:#eaedf3;--mu:#98a2b3;--bd:#2a303b;--ac:#6ea0ff;--ok:#41c57d;--dg:#f2766b;--h1:#172554;--h2:#1d4ed8;--sh:none;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:640px;margin:0 auto;padding:14px 14px 40px}
button,input,select,textarea{font:inherit;color:var(--tx)}
button{cursor:pointer;border:0;background:none;padding:0}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px 12px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ac);outline-offset:-1px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--h1),var(--h2));display:grid;place-items:center;font-size:22px}
.top b{font-size:19px;display:block}.mu{color:var(--mu);font-size:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:var(--sh)}
.bar2{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.bar2 select{flex:1;font-weight:600}
.sm{font-size:14px;font-weight:600;padding:12px 14px;border-radius:10px;background:var(--bg);border:1px solid var(--bd);white-space:nowrap}
.sm.d{color:var(--dg)}.sm.arm{background:var(--dg);color:#fff;border-color:var(--dg)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.tab{flex:0 0 auto;text-align:left;padding:9px 14px;border-radius:14px;background:var(--card);border:1px solid var(--bd);min-width:120px}
.tab b{display:block;font-size:14px}.tab span{font-size:12px;color:var(--mu)}
.tab.on{background:var(--ac);border-color:var(--ac)}.tab.on b,.tab.on span{color:#fff}
.tab.add{min-width:0;color:var(--ac);font-weight:600;align-self:stretch;display:grid;place-items:center}
.hero{background:linear-gradient(135deg,var(--h1),var(--h2));color:#fff;border-radius:20px;padding:18px;margin-bottom:12px}
.hero .l{font-size:12px;letter-spacing:.08em;opacity:.8;text-transform:uppercase}
.hero .big{font-size:38px;font-weight:800;font-variant-numeric:tabular-nums;margin:2px 0}
.hero .big small{font-size:18px;opacity:.8;font-weight:600}
.hero .s{font-size:13px;opacity:.9;margin-bottom:12px}
.bar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:rgba(255,255,255,.2)}.bar i{display:block;height:100%}
.hd{display:flex;justify-content:space-between;align-items:center;margin:16px 2px 8px}.hd b{font-size:16px}
.pri{background:var(--ac);color:#fff;font-weight:600;padding:10px 14px;border-radius:12px}
.it{background:var(--card);border:1px solid var(--bd);border-radius:14px;margin-bottom:8px;overflow:hidden}
.ih{display:flex;align-items:center;gap:10px;width:100%;padding:13px;text-align:left}
.dot{width:12px;height:12px;border-radius:4px;flex:0 0 auto}
.nm{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.nm em,.am em{display:block;font-style:normal;font-weight:400;font-size:13px;color:var(--mu)}
.am{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.ch{color:var(--mu);transition:transform .15s}.it.open .ch{transform:rotate(90deg)}
.bd{padding:2px 13px 13px;border-top:1px solid var(--bd)}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pr{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:8px;align-items:center;margin-top:8px}.pr div:last-child{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.cmp{display:grid;grid-template-columns:1fr auto;gap:2px 10px;width:100%;text-align:left;padding:8px 0}
.cmp .t{height:8px;border-radius:4px;background:var(--bd);grid-column:1/3;overflow:hidden}.cmp .t i{display:block;height:100%;background:var(--mu);border-radius:4px}
.cmp.min .t i{background:var(--ok)}.cmp.min .v{color:var(--ok)}.cmp.sel b{color:var(--ac)}
.v{font-weight:700;font-variant-numeric:tabular-nums}
.help{display:flex;gap:12px;align-items:flex-start}.help ol{margin:4px 0 8px;padding-left:18px;font-size:14px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet h3{margin:0 0 10px;font-size:18px}
.ty{display:block;width:100%;text-align:left;padding:12px;border:1px solid var(--bd);border-radius:12px;margin-top:8px;background:var(--bg)}.ty b{display:block}.ty span{font-size:13px;color:var(--mu)}
.cs{display:grid;grid-template-columns:1.3fr 1fr .8fr;gap:6px;margin-top:8px}.cl{font-size:12px;color:var(--mu);display:flex;justify-content:space-between;align-items:center;margin-top:3px}
.op{border:1px solid var(--bd);border-radius:12px;padding:10px;margin-top:8px}.op.on{border-color:var(--ac)}.oh{display:flex;gap:8px;align-items:center}.oh input{flex:1}.ot{display:flex;justify-content:space-between;align-items:baseline;margin-top:8px}.ot span{font-size:12px;color:var(--mu)}.ot.min b{color:var(--ok)}.ot.hi b{color:var(--dg)}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tag{font-size:12px;font-weight:700;color:var(--ac);white-space:nowrap}.sug{margin-top:8px;padding:10px;border-radius:10px;background:var(--bg);border:1px dashed var(--ok);font-size:14px;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}.ck{display:inline-flex;gap:6px;align-items:center;color:var(--tx);font-size:14px;margin:4px 12px 0 0}
@media(min-width:900px){main{max-width:820px}}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:#1b1f27;color:#fff;padding:12px 16px;border-radius:12px;z-index:30;font-size:15px;box-shadow:0 6px 20px rgba(0,0,0,.3);max-width:92vw}#toast button{margin-left:10px;color:#9ec2ff;font-weight:700;padding:4px 6px}.nm em{white-space:normal}.dt{margin-top:10px}
.ed{max-height:90vh;overflow:auto;padding-top:0}.edh{position:sticky;top:0;background:var(--card);display:flex;justify-content:space-between;align-items:center;padding:14px 0 10px;border-bottom:1px solid var(--bd);margin-bottom:6px;z-index:2;font-size:17px}.edh>span{font-weight:800}
.ed .bd{display:flex;flex-direction:column;padding:0;border:0}.ed .bd>button{align-self:flex-start}.ed .bd>details[data-k^="g"]{order:80}.ed .bd>details[data-k^="c"]{order:90}.ed .bd>.nt{order:100}.ed .bd>.stk{order:200}
.stk{position:sticky;bottom:0;background:var(--card);padding:12px 0 2px;border-top:1px solid var(--bd);margin-top:14px;z-index:2}
.bad{border-color:var(--dg)!important}.warn{color:var(--dg);font-size:13px;margin-top:4px}
.lnk{color:#fff;background:rgba(255,255,255,.18);border-radius:10px;padding:6px 10px;font-size:13px;text-align:left}
.tb{width:100%;border-collapse:collapse;font-size:15px;margin-top:6px}.tb td{padding:8px 4px;border-bottom:1px solid var(--bd);vertical-align:top}.tb td:last-child{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
details summary{cursor:pointer;font-weight:600}
</style>
</head>
<body>
<main id="app"></main>
<script>
const KEY="maliyet.v1",COL=["#2563eb","#f59e0b","#10b981","#ef4444","#8b5cf6","#06b6d4","#ec4899","#84cc16"];
const TUR={SABIT:"Sabit tutar",ADET:"Miktar × birim fiyat",ALAN:"Alan bazlı",CESIT:"Çeşitli ürün (boy/model)"};
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num=v=>{if(typeof v==="number")return isFinite(v)?v:0;let t=String(v).trim().replace(/\s/g,"");t=/^-?[1-9]\d{0,2}(\.\d{3})+(,\d+)?$/.test(t)?t.replace(/\./g,"").replace(",","."):t.replace(",",".");return parseFloat(t)||0};
const fmt=n=>n.toLocaleString("tr-TR",{minimumFractionDigits:2,maximumFractionDigits:2});
const tv=n=>String(n).replace(".",",");const tm=n=>num(n).toLocaleString("tr-TR",{minimumFractionDigits:2,maximumFractionDigits:6});const pc=n=>n>0&&n<0.1?"0,1’den az":n.toFixed(1).replace(".",",");const tf=n=>num(n).toLocaleString("tr-TR",{maximumFractionDigits:6});const fm0=n=>num(n).toLocaleString("tr-TR",{maximumFractionDigits:3});
function seed(){
  const sab=(ad,t)=>({id:uid(),ad,tur:"SABIT",tutar:t});
  const cs=d=>[["6 cm",90,d.p6],["8 cm",250,d.p8],["10 cm",350,d.p10]].map(x=>({id:uid(),ad:x[0],fiyat:x[1],bol:6,adet:x[2]}));
  const mk=(ad,d)=>({id:uid(),ad,items:[sab("Çam Bedeli",10000),sab("Geyik",50000),{id:uid(),ad:"Toplar",tur:"CESIT",cesit:cs(d)},{id:uid(),ad:"Işık Bedeli",tur:"ALAN",alan:80,kap:9,fiyat:599,yuk:true},{id:uid(),ad:"Led Bedeli",tur:"ADET",miktar:30,fiyat:1250}]});
  return{paket:[{id:"p6",ad:"6 cm",fiyat:90,adet:6},{id:"p8",ad:"8 cm",fiyat:250,adet:6},{id:"p10",ad:"10 cm",fiyat:350,adet:6}],
    orgs:[{id:uid(),ad:"Örnek Organizasyon",scs:[mk("400 adet – mevcut oran",{p6:181,p8:138,p10:81}),mk("400 adet – 80’i 6 cm’ye",{p6:225,p8:110,p10:65})]}],sel:{}};
}
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.orgs||!S.orgs.length)S=seed();
S.orgs.forEach(o=>o.scs.forEach(s=>s.items.forEach(i=>{if(i.tur==="TOP"){i.tur="CESIT";i.cesit=(S.paket||[]).map(p=>({id:uid(),ad:p.ad,fiyat:p.fiyat,bol:p.adet,adet:num((i.dag||{})[p.id])}))}})));
S.orgs.forEach(o=>{const b=o.scs[0];b.items.forEach((it,j)=>{if(it.tur==="CESIT"&&!it.secenekler){const cz=it.cesit||[];it.secenekler=[{id:uid(),ad:o.scs.length>1?b.ad:"Seçenek 1",adet:Object.fromEntries(cz.map(c=>[c.id,num(c.adet)]))}];it.sec=it.secenekler[0].id;o.scs.slice(1).forEach(q=>{const x=q.items[j];if(x&&x.tur==="CESIT"&&x.cesit)it.secenekler.push({id:uid(),ad:q.ad,adet:Object.fromEntries(cz.map((c,k)=>[c.id,num(x.cesit[k]&&x.cesit[k].adet)]))})})}});b.items.forEach(it=>(it.secenekler||[]).forEach(q=>{const M={"400 adet – mevcut oran":"Mevcut oran","Mevcut oranı koruyarak (toplam 400)":"Mevcut oran","400 adet – 80’i 6 cm’ye":"6 cm ağırlıklı","320’ye +80 adet, hepsi 6 cm’ye (toplam 400)":"6 cm ağırlıklı"};if(M[q.ad])q.ad=M[q.ad]}));o.scs=[b]});
const ui={sheet:null,armed:null,open:null,det:{}};
function toast(m,undo){let t=document.getElementById("toast");if(t)t.remove();t=document.createElement("div");t.id="toast";t.innerHTML=esc(m)+(undo?' <button data-c="undo">Geri al</button>':"");document.body.appendChild(t);clearTimeout(toast.h);toast.h=setTimeout(()=>t.remove(),undo?7000:3500)}
let saved=true;const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S));saved=true}catch(e){saved=false}};
const org=()=>S.orgs.find(o=>o.id===S.sel.o)||(S.sel.o=S.orgs[0].id,S.orgs[0]);
const sc=()=>org().scs[0];
const tek=p=>p.adet?p.fiyat/p.adet:0;
const alanAdet=it=>{const k=num(it.kap);if(!k)return 0;const r=num(it.alan)/k;return it.yuk===false?r:Math.ceil(r-1e-9)};
const det=it=>it.tur==="SABIT"?"Sabit tutar":it.tur==="ADET"?fm0(it.miktar)+" × "+fmt(num(it.fiyat))+" TL":it.tur==="ALAN"?(()=>{const k=num(it.kap),r=k?num(it.alan)/k:0,n=alanAdet(it);if(!k)return"⚠ Kapsama alanı (m²) girilmedi, tutar 0 hesaplanıyor";return fm0(it.alan)+" m² ÷ "+fm0(it.kap)+" m² = "+r.toLocaleString("tr-TR",{maximumFractionDigits:2})+" → "+n+" adet"+(n>r+1e-9?" (yukarı yuvarlandı)":"")+" × "+fmt(num(it.fiyat))+" TL"})():(()=>{const o=secOpt(it);return o?esc(o.ad)+" · "+(it.cesit||[]).map(c=>esc(c.ad)+": "+num((o.adet||{})[c.id])).join(", "):"Çeşit dağılımı"})();
const secOpt=it=>(it.secenekler||[]).find(o=>o.id===it.sec)||(it.secenekler||[])[0];
const optTot=(it,o)=>(it.cesit||[]).reduce((a,c)=>a+(num(c.bol)?num((o.adet||{})[c.id])*num(c.fiyat)/num(c.bol):0),0);
const ensC=it=>{it.cesit=it.cesit||[];if(!it.cesit.length)it.cesit.push({id:uid(),ad:"Çeşit 1",fiyat:0,bol:1});it.secenekler=it.secenekler||[];if(!it.secenekler.length)it.secenekler.push({id:uid(),ad:"Seçenek 1",adet:{}});it.secenekler.forEach(o=>o.adet=o.adet||{});if(!it.secenekler.some(o=>o.id===it.sec))it.sec=it.secenekler[0].id};
const split=(n,k)=>Array.from({length:k},(_,i)=>Math.floor(n/k)+(i<n%k?1:0));
function genAd(it,mode){ensC(it);const cur=secOpt(it),ids=it.cesit.map(c=>c.id),N=Math.round(it.gn!=null?it.gn:ids.reduce((a,x)=>a+num(cur.adet[x]),0)),W=ids.filter(x=>(it.gw||[]).includes(x)),R=ids.filter(x=>!W.includes(x)),adet={};let nm="Eşit dağılım";
  if(mode==="eq"||!W.length||!R.length)split(N,ids.length).forEach((v,i)=>adet[ids[i]]=v);
  else{const p=Math.min(100,Math.max(0,it.gp!=null?it.gp:80)),nw=Math.round(N*p/100);split(nw,W.length).forEach((v,i)=>adet[W[i]]=v);split(N-nw,R.length).forEach((v,i)=>adet[R[i]]=v);nm=it.cesit.filter(c=>W.includes(c.id)).map(c=>c.ad).join(" + ")+" ağırlıklı"}
  return{nm,adet}}
function gen(it,mode){const r=genAd(it,mode);it.secenekler.push({id:uid(),ad:r.nm,adet:r.adet})}
const itT=it=>it.tur==="SABIT"?num(it.tutar):it.tur==="ADET"?num(it.miktar)*num(it.fiyat):it.tur==="ALAN"?alanAdet(it)*num(it.fiyat):(()=>{const o=secOpt(it);return o?optTot(it,o):0})();
const scT=s=>Math.round(s.items.filter(i=>!i.yeni).reduce((a,i)=>a+Math.round(itT(i)*100)/100,0)*100)/100;
const arm=(k,l)=>`<button class="sm d${ui.armed===k?" arm":""}" data-c="${k}">${ui.armed===k?"Emin misin? Sil":l}</button>`;

function liste(s){const m=[];s.items.filter(i=>!i.yeni).forEach(it=>{const nm=it.ad.replace(/\s*bedeli$/i,"");if(it.tur==="ADET")m.push([nm,fm0(it.miktar)]);else if(it.tur==="ALAN")m.push([nm,String(alanAdet(it))]);else if(it.tur==="CESIT"){const o=secOpt(it);(it.cesit||[]).forEach(c=>m.push([nm+" – "+c.ad,String(num(((o||{}).adet||{})[c.id]))]))}});return m}
function tablo(s){const r2=n=>tv((Math.round(n*100)/100).toFixed(2)),un=x=>x.replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"');
  let a="Kalem\tTür\tDetay\tTutar (TL)\n";
  s.items.filter(i=>!i.yeni).forEach(it=>{a+=[it.ad,TUR[it.tur],un(det(it)),r2(itT(it))].join("\t")+"\n"});
  return a+"Toplam\t\t\t"+r2(scT(s))+"\n\nMalzeme\tAdet\n"+liste(s).map(r=>r.join("\t")).join("\n")+"\n"}
function draw(){save();document.body.style.zoom=S.zoom||1;
  const o=org(),s=sc(),tots=o.scs.map(scT),mn=Math.min(...tots),mx=Math.max(...tots,1),T=scT(s);
  let ed=null;const its=s.items.map(i=>({i,t:itT(i)}));
  let h=`<div class="top"><div class="logo">🧮</div><div><b>Maliyet Hesabı</b><span class="mu">Organizasyon bazlı net maliyet</span></div><span class="bar2" style="margin-left:auto;gap:6px"><button class="sm" data-c="zm" aria-label="Yazıyı küçült">A−</button><button class="sm" data-c="zp" aria-label="Yazıyı büyüt">A+</button><button class="sm" data-c="helpon" aria-label="Yardım">?</button></span></div>`;
  if(S.hint!==false)h+=`<div class="card help"><div style="flex:1"><b>Nasıl kullanılır?</b><div class="mu">Organizasyon maliyetini kalem kalem hesaplar, farklı seçenekleri karşılaştırır.</div><ol><li>Üstten organizasyonu seç</li><li>Kalemlere dokunup tutar veya adetleri gir</li><li>Net maliyeti yukarıda gör; toplar gibi kalemlerde dağılım seçeneklerini karşılaştır</li></ol><button class="sm" data-c="hint">Anladım, gizle</button></div></div>`;
  h+=`<div class="card"><div class="mu" style="margin-bottom:6px">Organizasyon</div><div class="bar2"><select data-a="org">${S.orgs.map(x=>`<option value="${x.id}"${x.id===o.id?" selected":""}>${esc(x.ad)}</option>`).join("")}</select><button class="sm" data-c="sh-rename">Adı değiştir</button><button class="sm" data-c="orgdup">Kopyasını oluştur</button><button class="sm" data-c="sh-org">+ Yeni</button></div></div>`;
  
  const chp=i=>{if(i.tur!=="CESIT"||!i.secenekler||i.secenekler.length<2)return null;const ts=i.secenekler.map(q=>optTot(i,q)),m=Math.min(...ts),d=itT(i)-m;return d>0.5?{i,d,b:i.secenekler[ts.indexOf(m)]}:null};
  const sgs=s.items.map(chp).filter(Boolean),tas=sgs.reduce((a,x)=>a+x.d,0),
  sub=tas>0.5?`<div style="margin-top:6px">💡 ${sgs.map(x=>esc(x.i.ad)+": «"+esc(secOpt(x.i).ad)+"» yerine «"+esc(x.b.ad)+"» seçersen "+fmt(x.d)+" TL daha ucuz").join("; ")}. Toplam <b>${fmt(T-tas)} TL</b> olur.</div><div class="bar2" style="margin-top:8px"><button class="lnk" data-c="applyall">Tüm önerileri uygula</button></div>`:"seçili seçeneklerle";
  h+=`<section class="hero"><div class="l">Net maliyet · ${esc(o.ad)}</div><div class="big">${fmt(T)} <small>TL</small></div><div class="s">${s.items.filter(i=>!i.yeni).length} kalem · ${sub}</div><div class="bar">${its.filter(x=>!x.i.yeni).map((x,i)=>`<i style="width:${T?x.t/T*100:0}%;background:${COL[i%8]}"></i>`).join("")}</div></section>`+(ui.last?`<div class="card" style="display:flex;gap:8px;justify-content:space-between;align-items:center"><span>↩ ${esc(ui.last)}</span><button class="sm" data-c="undo">Geri al</button></div>`:"");
  h+=`<div class="hd"><b>Maliyet kalemleri</b><span class="bar2" style="gap:6px"><button class="sm" data-c="sh-tablo">📋 Malzeme listesi</button><button class="pri" data-c="sh-add">+ Kalem ekle</button></span></div><div class="mu" style="margin:-4px 2px 8px">Sağdaki yüzde, kalemin toplam maliyetteki payıdır.</div>`;
  if(!its.length)h+=`<div class="card mu">Henüz kalem yok. “Kalem ekle” ile başla.</div>`;
  h+=its.map((x,n)=>{

  else if(c==="orgdup"){const x=JSON.parse(JSON.stringify(o));x.id=uid();x.ad=o.ad+" (kopya)";x.scs[0].id=uid();x.scs[0].items.forEach(i=>i.id=uid());S.orgs.push(x);S.sel={o:x.id}}
  else if(c.startsWith("gen:")){const q=c.split(":");const g2=s.items.find(x=>x.id===q[2]);gen(g2,q[1]);toast("“"+g2.secenekler[g2.secenekler.length-1].ad+"” eklendi. Kullanmak için üstteki listeden seç.")}
  else if(c.startsWith("use:")){const q=c.split(":"),was=scT(s);ui.undo=JSON.stringify(S);s.items.find(x=>x.id===q[1]).sec=q[2];ui.last="Dağılım değiştirildi: "+fmt(was)+" → "+fmt(scT(s))+" TL";toast("Uygulandı. Yeni toplam: "+fmt(scT(s))+" TL",true)}
  else if(c.startsWith("addo:")){const it=s.items.find(x=>x.id===c.slice(5)),cur=secOpt(it);it.secenekler.push({id:uid(),ad:"Seçenek "+(it.secenekler.length+1),adet:Object.assign({},cur.adet)})}
  else{ // iki dokunuşlu silme
    if(ui.armed!==c){ui.armed=c;return draw()}
    ui.armed=null;ui.undo=JSON.stringify(S);ui.last="Silme yapıldı";toast("Silindi",true);
    if(c.startsWith("delit:"))s.items=s.items.filter(x=>x.id!==c.slice(6));
    else if(c.startsWith("delo:")){const q=c.split(":"),it=s.items.find(x=>x.id===q[1]);if(it.secenekler.length>1){it.secenekler=it.secenekler.filter(x=>x.id!==q[2]);if(it.sec===q[2])it.sec=it.secenekler[0].id}}
    else if(c.startsWith("delc:")){const q=c.split(":"),it=s.items.find(x=>x.id===q[1]);it.cesit=it.cesit.filter(x=>x.id!==q[2])}
    else if(c.startsWith("delp:"))S.paket=S.paket.filter(x=>x.id!==c.slice(5));
    else if(c==="delsc"&&o.scs.length>1){o.scs=o.scs.filter(x=>x.id!==s.id);S.sel.s=null}
    else if(c==="delorg"&&S.orgs.length>1){S.orgs=S.orgs.filter(x=>x.id!==o.id);S.sel={}}
  }
  ui.armed=null;draw();
});
document.addEventListener("toggle",e=>{const k=e.target.dataset&&e.target.dataset.k;if(k)ui.det[k]=e.target.open},true);
draw();
</script>
</body>
